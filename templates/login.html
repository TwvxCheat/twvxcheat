<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwvxCheat - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 30px;
        }
        .form-control {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #475569;
        }
        .form-control:focus {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="login-card shadow-lg text-center">
        <h3 class="fw-bold mb-3 text-warning"><i class="fa-solid fa-crown me-2"></i> TwvxCheat</h3>
        <p class="text-secondary small mb-4">أدخل بيانات الاعتماد للوصول للوحة التحكم</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label small text-secondary">اسم المستخدم:</label>
                <input type="text" name="username" class="form-control" required placeholder="اسم المستخدم">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small text-secondary">كلمة السر:</label>
                <input type="password" name="password" class="form-control" required placeholder="كلمة السر">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">تسجيل الدخول <i class="fa-solid fa-right-to-bracket ms-1"></i></button>
        </form>
    </div>
</body>
</html>
