<?php
// تحديد نوع الاستجابة كنص عادي
header('Content-Type: text/plain');

// استدعاء ملف الاتصال بقاعدة البيانات
require_once 'config.php';

// استقبال المفتاح من الرابط
$key = $_GET['key'] ?? '';

if (empty($key)) {
    echo "INVALID";
    exit;
}

try {
    // الاستعلام عن المفتاح في قاعدة البيانات
    $stmt = $pdo->prepare("SELECT * FROM keys WHERE key_code = ? AND status = 'active'");
    $stmt->execute([$key]);

    if ($stmt->rowCount() > 0) {
        echo "VALID";
    } else {
        echo "INVALID";
    }
} catch (PDOException $e) {
    echo "ERROR";
}
?>
